<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Optemizers — Match the Baby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Optemization brand */
    --energy: #11E68D;
    --energy-dim: #0fcc7d;
    --ink: #000000;
    --slate: #262626;
    --silicon: #EFEFEF;
    --silicon-2: #8A8A8A;
    --line: #d9d9d9;
    --bg: #f4f4f3;
    --card: #ffffff;
    --shadow: 0 1px 0 rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Header */
  .topbar {
    background: var(--ink);
    color: var(--silicon);
    padding: 28px 24px 36px;
    text-align: center;
    border-bottom: 4px solid var(--energy);
  }
  .wordmark {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--silicon);
    text-transform: lowercase;
    font-size: 14px;
    opacity: 0.8;
  }
  .wordmark::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--energy);
    border-radius: 2px;
    align-self: center;
  }
  h1 {
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin: 14px 0 8px;
    color: white;
  }
  h1 em {
    font-style: normal;
    color: var(--energy);
  }
  .subtitle {
    font-size: clamp(14px, 1.6vw, 18px);
    color: var(--silicon-2);
    margin: 0;
    font-weight: 400;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  .name-row {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }
  .name-input {
    width: min(420px, 100%);
    padding: 14px 18px;
    font-size: 17px;
    font-family: inherit;
    font-weight: 500;
    letter-spacing: -0.01em;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .name-input::placeholder { color: var(--silicon-2); font-weight: 400; }
  .name-input:focus {
    outline: none;
    border-color: var(--energy);
    box-shadow: 0 0 0 3px rgba(17, 230, 141, 0.18);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .card {
    position: relative;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--ink); }
  .card.answered { border-color: var(--energy); }
  .photo-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--silicon);
    overflow: hidden;
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  .badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--ink);
    color: var(--energy);
    font-weight: 800;
    font-size: 18px;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -0.02em;
  }
  .card.answered .badge {
    background: var(--energy);
    color: var(--ink);
  }
  .card select {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    border: none;
    border-top: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 40px;
    cursor: pointer;
  }
  .card.answered select { border-top-color: var(--energy); background-color: #f1fdf6; }
  .card select:focus { outline: none; }

  .submit-row {
    margin-top: 36px;
    text-align: center;
  }
  .progress {
    color: var(--slate);
    font-size: 14px;
    margin-bottom: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .progress strong { color: var(--ink); font-weight: 700; }
  .submit-btn {
    background: var(--ink);
    color: var(--energy);
    border: none;
    padding: 16px 40px;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: -0.01em;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  .submit-btn:hover { background: var(--energy); color: var(--ink); transform: translateY(-1px); box-shadow: 0 10px 28px rgba(17,230,141,0.35); }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { background: #d4d4d4; color: #999; cursor: not-allowed; box-shadow: none; transform: none; }
  .submit-btn .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result */
  .result {
    text-align: center;
    padding: 48px 28px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    max-width: 540px;
    margin: 0 auto;
  }
  .result-title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 0 0 4px;
  }
  .score-num {
    font-size: clamp(96px, 18vw, 160px);
    font-weight: 800;
    color: var(--energy);
    letter-spacing: -0.05em;
    line-height: 1;
    margin: 8px 0 0;
    -webkit-text-stroke: 1px var(--ink);
  }
  .score-out-of {
    color: var(--slate);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .result-msg {
    color: var(--slate);
    margin: 4px 0 22px;
    font-size: 17px;
    font-weight: 500;
  }
  .saved-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ecfdf3;
    color: #166534;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 24px;
    border: 1px solid #bbf7d0;
  }
  .saved-pill.error { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .saved-pill::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--energy);
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(17,230,141,0.3);
  }
  .saved-pill.error::before { background: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.3); }
  .copy-btn {
    background: var(--ink);
    color: var(--energy);
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: background 0.15s, color 0.15s;
  }
  .copy-btn:hover { background: var(--energy); color: var(--ink); }
  .copy-hint {
    margin-top: 18px;
    color: var(--silicon-2);
    font-size: 13px;
    font-weight: 500;
  }
  .review-link {
    margin-top: 24px;
    font-size: 14px;
  }
  .review-link a {
    color: var(--slate);
    text-decoration: underline;
    cursor: pointer;
    font-weight: 500;
  }

  /* Confetti */
  .confetti {
    position: fixed;
    top: -10px;
    width: 12px;
    height: 14px;
    pointer-events: none;
    z-index: 1000;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.7; }
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 16px 20px 40px;
    color: var(--silicon-2);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .topbar { padding: 22px 16px 28px; }
    .container { padding: 24px 14px 48px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .badge { width: 34px; height: 34px; font-size: 15px; top: 10px; left: 10px; }
    .card select { padding: 12px 14px; font-size: 14px; }
    .submit-btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark">optemization</div>
  <h1>Match the <em>baby</em>.</h1>
  <p class="subtitle">16 numbered photos → match each to a teammate. Some are trick questions. Top 3 win.</p>
</div>

<main class="container">
  <section id="game">
    <div class="name-row">
      <input type="text" id="playerName" class="name-input" placeholder="Your name" autocomplete="off" required>
    </div>

    <form id="game-form">
      <div class="grid" id="grid"></div>
      <div class="submit-row">
        <div class="progress"><strong id="progressNum">0</strong> / 16 answered</div>
        <button type="submit" class="submit-btn" id="submitBtn" disabled>Lock in my guesses</button>
      </div>
    </form>
  </section>

  <section id="result" class="result" hidden>
    <h2 class="result-title" id="resultTitle">Submitted!</h2>
    <div class="score-num"><span id="scoreNum">0</span><span class="score-out-of"> / 16</span></div>
    <p class="result-msg" id="resultMsg"></p>
    <div class="saved-pill" id="savedPill" hidden></div>
    <div>
      <button class="copy-btn" id="copyBtn">📋 Copy result for Slack</button>
    </div>
    <p class="copy-hint">Backup: paste in the Slack thread if leaderboard didn't save.</p>
    <p class="review-link"><a id="reviewLink">← Edit my answers</a></p>
  </section>
</main>

<footer>built for the all-hands · 2026.04.30</footer>

<script>
  const ENDPOINT = "https://primary-production-022b.up.railway.app/webhook/baby-optemizers";

  const PHOTOS = [
    { n: 1,  file: "photos/luiza-1.jpeg",     answer: "Luiza" },
    { n: 2,  file: "photos/marcelo-1.jpg",    answer: "Marcelo" },
    { n: 3,  file: "photos/irene.jpg",        answer: "Irene" },
    { n: 4,  file: "photos/lidia.jpg",        answer: "Lídia" },
    { n: 5,  file: "photos/tem.jpg",          answer: "Tem" },
    { n: 6,  file: "photos/marcelo-2.jpg",    answer: "Marcelo" },
    { n: 7,  file: "photos/natalie.jpg",      answer: "Natalie" },
    { n: 8,  file: "photos/luiza-2.jpeg",     answer: "Luiza" },
    { n: 9,  file: "photos/dunston.jpg",      answer: "Dunston" },
    { n: 10, file: "photos/esteban-1.png",    answer: "Esteban" },
    { n: 11, file: "photos/skyler.png",       answer: "Skyler" },
    { n: 12, file: "photos/vini.jpg",         answer: "Vini" },
    { n: 13, file: "photos/hasty.jpg",        answer: "Hasty" },
    { n: 14, file: "photos/mike.jpg",         answer: "Mike" },
    { n: 15, file: "photos/beckham.jpg",      answer: "Beckham" },
    { n: 16, file: "photos/esteban-2.png",    answer: "Elliot" }
  ];
  const TEAM = ["Beckham", "Dunston", "Elliot", "Esteban", "Hasty", "Irene", "Lídia", "Luiza", "Marcelo", "Mike", "Natalie", "Skyler", "Tem", "Vini"];

  const grid = document.getElementById("grid");
  const form = document.getElementById("game-form");
  const submitBtn = document.getElementById("submitBtn");
  const progressNum = document.getElementById("progressNum");
  const playerName = document.getElementById("playerName");

  // Build cards
  PHOTOS.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.n = p.n;

    const wrap = document.createElement("div");
    wrap.className = "photo-wrap";
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = p.n;
    const img = document.createElement("img");
    img.src = p.file;
    img.alt = `Baby photo ${p.n}`;
    img.loading = "lazy";
    wrap.appendChild(img);
    wrap.appendChild(badge);

    const select = document.createElement("select");
    select.name = `q${p.n}`;
    select.required = true;
    select.innerHTML = `<option value="">Pick a teammate…</option>` +
      TEAM.map(t => `<option value="${t}">${t}</option>`).join("");
    select.addEventListener("change", () => {
      card.classList.toggle("answered", !!select.value);
      updateProgress();
    });

    card.appendChild(wrap);
    card.appendChild(select);
    grid.appendChild(card);
  });

  function updateProgress() {
    const answered = [...form.querySelectorAll("select")].filter(s => s.value).length;
    progressNum.textContent = answered;
    submitBtn.disabled = !(answered === 16 && playerName.value.trim().length > 0);
  }
  playerName.addEventListener("input", updateProgress);

  // Restore previous submission
  const saved = localStorage.getItem("submission");
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.name) playerName.value = s.name;
      if (s.guesses) {
        Object.entries(s.guesses).forEach(([k, v]) => {
          const sel = form.querySelector(`select[name="${k}"]`);
          if (sel) {
            sel.value = v;
            sel.closest(".card").classList.toggle("answered", !!v);
          }
        });
      }
      updateProgress();
    } catch (e) {}
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = playerName.value.trim();
    if (!name) return;
    const data = new FormData(form);
    const guessesArr = PHOTOS.map(p => data.get(`q${p.n}`));
    let score = 0;
    PHOTOS.forEach((p, i) => { if (guessesArr[i] === p.answer) score++; });

    const guessesMap = {};
    PHOTOS.forEach((p, i) => { guessesMap[`q${p.n}`] = guessesArr[i]; });
    localStorage.setItem("submission", JSON.stringify({ name, score, guesses: guessesMap, time: Date.now() }));

    // Show submitting state
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Submitting...';

    let savedToBackend = false;
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name,
          guesses: guessesArr,
          userAgent: navigator.userAgent
        })
      });
      if (res.ok) {
        savedToBackend = true;
      }
    } catch (err) {
      console.warn("Submission failed:", err);
    }

    // Reveal result
    document.getElementById("game").hidden = true;
    const result = document.getElementById("result");
    result.hidden = false;
    document.getElementById("scoreNum").textContent = score;

    const msgs = {
      16: { t: "Perfect score 🏆",     m: "You spotted every kid AND every trick. Suspicious." },
      15: { t: "Almost flawless ✨",    m: "One slip from immortality." },
      14: { t: "Excellent 🎉",           m: "You really know this team." },
      13: { t: "Strong work 👏",         m: "Solid eye for baby faces." },
      12: { t: "Strong work 👏",         m: "Solid eye for baby faces." },
      11: { t: "Nice 🙌",                 m: "Above average. Respectable." },
      10: { t: "Nice 🙌",                 m: "Above average. Respectable." },
      9:  { t: "Decent 🙃",              m: "You got most of them." },
      8:  { t: "Halfway there 🤷",       m: "Coin-flip territory but charming." },
      7:  { t: "Halfway there 🤷",       m: "Coin-flip territory but charming." },
      6:  { t: "Tough crowd 😅",         m: "Babies all kind of look alike, right?" },
      5:  { t: "Tough crowd 😅",         m: "Babies all kind of look alike, right?" },
      4:  { t: "Eh 🫠",                   m: "There's always next year." },
      3:  { t: "Bold guesses 🎲",        m: "At least you committed." },
      2:  { t: "Oof 😬",                  m: "Did you click randomly?" },
      1:  { t: "Yikes 🫣",                m: "Statistically you should have done better." },
      0:  { t: "Anti-perfect 🪦",        m: "This took skill." }
    };
    const m = msgs[score] || msgs[0];
    document.getElementById("resultTitle").textContent = m.t;
    document.getElementById("resultMsg").textContent = m.m;

    const pill = document.getElementById("savedPill");
    pill.hidden = false;
    if (savedToBackend) {
      pill.classList.remove("error");
      pill.textContent = "Saved to leaderboard";
    } else {
      pill.classList.add("error");
      pill.textContent = "Couldn't reach the leaderboard — paste your score in Slack as backup";
    }

    if (score >= 14) burstConfetti();
    window.scrollTo({ top: 0, behavior: "smooth" });

    const copyBtn = document.getElementById("copyBtn");
    const ts = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const payload = `🍼 ${name} — ${score}/14 (${ts})`;
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(payload);
        copyBtn.textContent = "✅ Copied — paste in Slack";
      } catch {
        copyBtn.textContent = payload;
      }
    };
  });

  document.getElementById("reviewLink").addEventListener("click", () => {
    document.getElementById("result").hidden = true;
    document.getElementById("game").hidden = false;
    submitBtn.innerHTML = "Lock in my guesses";
    submitBtn.disabled = false;
    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  function burstConfetti() {
    const colors = ["#11E68D", "#000000", "#262626", "#11E68D", "#FFFFFF", "#11E68D"];
    for (let i = 0; i < 100; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = 2 + Math.random() * 2 + "s";
      c.style.animationDelay = Math.random() * 0.5 + "s";
      c.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }
</script>
</body>
</html>
